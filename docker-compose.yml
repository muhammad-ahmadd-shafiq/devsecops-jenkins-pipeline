services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins

    restart: unless-stopped

    user: root

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - devsecops-net

volumes:
  jenkins_home:

networks:
  devsecops-net:
    external: true
